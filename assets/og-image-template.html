<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1200" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px 80px;
    overflow: hidden;
    position: relative;
  }

  /* Background decorative elements */
  .bg-circle-1 {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(196, 147, 63, 0.06);
    top: -100px; right: -80px;
  }
  .bg-circle-2 {
    position: absolute;
    width: 250px; height: 250px;
    border-radius: 50%;
    background: rgba(139, 106, 62, 0.05);
    bottom: -60px; left: 300px;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,106,62,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,106,62,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Left content */
  .left { position: relative; z-index: 1; flex: 1; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid rgba(76,175,80,0.3);
    color: #2D7A36;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 50px;
    margin-bottom: 28px;
  }
  .badge-dot {
    width: 8px; height: 8px;
    background: #4CAF50;
    border-radius: 50%;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 700;
    color: #3D2B1F;
    line-height: 1.05;
    margin-bottom: 16px;
  }
  .name span { color: #C4933F; }

  .title {
    font-size: 20px;
    color: #7A6A58;
    font-weight: 400;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .tag {
    background: white;
    border: 1px solid rgba(139,106,62,0.2);
    color: #8B6A3E;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 50px;
    font-weight: 500;
  }

  /* Right — card */
  .right {
    position: relative;
    z-index: 1;
    margin-left: 60px;
    flex-shrink: 0;
  }

  .card {
    background: white;
    border: 1px solid rgba(139,106,62,0.15);
    border-radius: 20px;
    padding: 32px;
    width: 260px;
  }

  .avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: #EDE6D8;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: #8B6A3E;
    margin-bottom: 16px;
    border: 2px solid rgba(139,106,62,0.2);
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #3D2B1F;
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 13px;
    color: #7A6A58;
    margin-bottom: 20px;
  }

  .card-stat { margin-bottom: 10px; }
  .card-stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: #3D2B1F;
  }
  .card-stat-num span { color: #C4933F; font-size: 14px; }
  .card-stat-lbl { font-size: 11px; color: #A89880; }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #3D2B1F, #C4933F, #3D2B1F);
  }

  .url {
    position: absolute;
    bottom: 24px; left: 80px;
    font-size: 13px;
    color: #A89880;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="left">
    <div class="badge">
      <div class="badge-dot"></div>
      Open to internships &amp; freelance
    </div>
    <div class="name">Swayam<br><span>Jadhav</span></div>
    <div class="title">B.E. CSE Student &amp; Full-Stack Developer<br>KKWIEER, Nashik, Maharashtra</div>
    <div class="tags">
      <span class="tag">Next.js</span>
      <span class="tag">React</span>
      <span class="tag">TypeScript</span>
      <span class="tag">Node.js</span>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div class="avatar">SJ</div>
      <div class="card-name">Swayam Jadhav</div>
      <div class="card-sub">Full-Stack Developer</div>
      <div class="card-stat">
        <div class="card-stat-num">5<span>+</span></div>
        <div class="card-stat-lbl">Projects completed</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-num">8<span>+</span></div>
        <div class="card-stat-lbl">Technologies</div>
      </div>
      <div class="card-stat">
        <div class="card-stat-num">2<span>+</span></div>
        <div class="card-stat-lbl">Years of learning</div>
      </div>
    </div>
  </div>

  <div class="url">swayamjadhav.vercel.app</div>
  <div class="bottom-bar"></div>
</body>
</html>
